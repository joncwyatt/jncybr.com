<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex">
    <title>Page not found — jncybr</title>
    <!-- GitHub Pages serves this file at any missing URL, so every link here is absolute. -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="page-container">
        <section class="hero hero--404">
            <p class="hero__greeting">404</p>
            <h1 class="hero__name">Page not found</h1>
            <p class="hero__tagline">The link may be broken, or the page has moved. Try one of these instead.</p>
            <div class="app-links app-links--center">
                <a href="/" class="btn btn--primary">Home</a>
                <a href="/recipes/" class="btn btn--ghost">Recipes</a>
                <a href="/side-projects/" class="btn btn--ghost">Side Projects</a>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <p class="site-footer__text">&copy; 2026 Jon Wyatt &middot; <a href="https://github.com/joncwyatt">GitHub</a></p>
    </footer>
</body>
</html>
